# Branch-specific landed-commit qualification for `beta`.
name: SultanC Integration

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

# Every landed SHA gets its own immutable evidence; do not cancel older landed commits.
concurrency:
  group: sultanc-integration-beta-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Landed Commit Qualification
    uses: ./.github/workflows/qualification.yml
    with:
      candidate-ref: ${{ github.sha }}
      profile: beta
      mode: full

  required:
    name: Required / SultanC Integration
    if: ${{ always() }}
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable integration harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Bind qualification to landed SHA
        shell: bash
        env:
          RESULT: ${{ needs.qualification.result }}
          BRANCH: beta
          READY: ${{ needs.qualification.outputs.promotion_ready }}
          CANDIDATE_SHA: ${{ needs.qualification.outputs.candidate_sha }}
          EXPECTED_SHA: ${{ github.sha }}
          HARNESS_SHA: ${{ needs.qualification.outputs.harness_sha }}
        run: ./harness/.github/scripts/integration-required.sh

  # Landed failures create/update issues; PR failures remain check results only.
  report-failure:
    name: Report CI Failure
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        needs.qualification.result == 'failure'
      }}
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout landed CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create or update deduplicated CI issue
        uses: ./.github/actions/report-ci-failure
        with:
          component-labels: compiler,integration
          tested-branch: beta
          tested-sha: ${{ github.sha }}
          harness-sha: ${{ needs.qualification.outputs.harness_sha }}
