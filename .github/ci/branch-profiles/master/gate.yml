# Branch-specific PR/merge-queue entry point for `master`.
name: SultanC Gate

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
    branches: [master]

permissions:
  contents: read

# Supersede stale candidate runs, but never share concurrency across branches.
concurrency:
  group: >-
    sultanc-gate-master-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Candidate Qualification
    uses: ./.github/workflows/qualification.yml
    with:
      candidate-ref: ${{ github.sha }}
      profile: master
      mode: full

  # One stable aggregate is suitable for branch-protection required checks.
  required:
    name: Required / SultanC Gate
    if: ${{ always() }}
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable gate harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Enforce branch gate
        shell: bash
        env:
          RESULT: ${{ needs.qualification.result }}
          DESTINATION: master
          CANDIDATE_SHA: ${{ github.sha }}
        run: ./harness/.github/scripts/gate-required.sh
