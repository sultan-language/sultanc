# Build the compiler once and retain diagnostics in the shared CI artifact tree.
name: SultanC Build
description: >-
  Build SultanC through the repository-owned build entry point and verify the
  resulting compiler artifact.

inputs:
  target:
    description: Optional target; empty means host auto-detection.
    required: false
    default: ""
  working-directory:
    description: Repository directory containing build.sh.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Prepare staged LLVM toolchain
      shell: bash
      run: >-
        "$GITHUB_ACTION_PATH/../llvm-toolchain/setup.sh"
        "$GITHUB_ACTION_PATH/../../ci/contracts.json"

    - name: Build and verify SultanC
      shell: bash
      env:
        SULTANC_TARGET: ${{ inputs.target }}
        SULTANC_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: "$GITHUB_ACTION_PATH/run.sh"
