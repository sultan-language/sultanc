# Landed/scheduled failures become deduplicated issues; PR failures stay checks.
name: SultanC CI Failure Reporter
description: >-
  Create or update branch-aware deduplicated GitHub Issues for completed failed
  jobs in the current workflow run.

inputs:
  component-labels:
    description: Additional comma-separated labels.
    required: false
    default: ""
  tested-branch:
    description: Branch whose candidate was actually tested.
    required: true
  tested-sha:
    description: Exact candidate SHA that was actually tested.
    required: true
  harness-sha:
    description: Exact CI harness SHA used for qualification.
    required: true
  job-name-filter:
    description: Optional substring restricting failed jobs owned by this reporter.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Report completed failed jobs
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SULTANC_REPOSITORY: ${{ github.repository }}
        SULTANC_RUN_ID: ${{ github.run_id }}
        SULTANC_WORKFLOW: ${{ github.workflow }}
        SULTANC_BRANCH: ${{ inputs.tested-branch }}
        SULTANC_SHA: ${{ inputs.tested-sha }}
        SULTANC_HARNESS_SHA: ${{ inputs.harness-sha }}
        SULTANC_JOB_FILTER: ${{ inputs.job-name-filter }}
        SULTANC_SERVER_URL: ${{ github.server_url }}
        SULTANC_COMPONENT_LABELS: ${{ inputs.component-labels }}
      run: "$GITHUB_ACTION_PATH/report.sh"
