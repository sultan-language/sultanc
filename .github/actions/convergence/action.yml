# Self-host convergence is distinct evidence from the regression suite.
name: SultanC Self-Host Convergence
description: >-
  Run ./build.sh verify with the host's declared build options: Stage3 and
  Stage4 must be byte-identical (plus the cross-backend check the build
  defines). Reports the SHA-256 of every verify product.

inputs:
  working-directory:
    description: Candidate repository directory.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Verify self-host convergence
      shell: bash
      env:
        SULTANC_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: '"$GITHUB_ACTION_PATH/run.sh"'
