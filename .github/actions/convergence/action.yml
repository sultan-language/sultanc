# Self-host convergence is distinct evidence from the regression suite.
name: SultanC Self-Host Convergence
description: >-
  Rebuild SultanC through Stage3 and Stage4 and require those self-hosted
  compilers to converge byte-for-byte.

inputs:
  target:
    description: Host-native target used for Stage3 and Stage4 generation.
    required: true
  compiler:
    description: Stage2 compiler path relative to the candidate checkout.
    required: false
    default: build/sultanc
  working-directory:
    description: Candidate repository directory.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Verify self-host convergence
      shell: bash
      env:
        SULTANC_TARGET: ${{ inputs.target }}
        SULTANC_COMPILER: ${{ inputs.compiler }}
        SULTANC_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: "$GITHUB_ACTION_PATH/run.sh"
