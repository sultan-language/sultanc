# Examples count as evidence only when an approved expectation contract exists.
name: SultanC Examples
description: >-
  Run approved deterministic Arabic/English example pairs and verify expected
  results plus native/interpreter parity.

inputs:
  compiler:
    description: Compiler path relative to the candidate checkout.
    required: false
    default: build/sultanc
  working-directory:
    description: Candidate checkout directory.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Verify approved examples
      shell: bash
      env:
        SULTANC_COMPILER: ${{ inputs.compiler }}
        SULTANC_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: "$GITHUB_ACTION_PATH/run.sh"
