# Native lanes prove the actual runner architecture and compiler artifact identity.
name: SultanC Target Verification
description: >-
  Verify runner identity and the native compiler artifact while retaining the
  inspection evidence used by CI.

inputs:
  target:
    description: SultanC target represented by this runner.
    required: true
  expected-host-os:
    description: Expected uname operating-system identity.
    required: true
  expected-host-arch:
    description: Expected uname architecture identity.
    required: true
  expected-file-pattern:
    description: Required file(1) regular expression for the compiler artifact.
    required: true
  binary:
    description: Compiler binary relative to the candidate checkout.
    required: false
    default: build/sultanc
  working-directory:
    description: Candidate checkout directory.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Verify SultanC target contract
      shell: bash
      env:
        SULTANC_TARGET: ${{ inputs.target }}
        EXPECTED_HOST_OS: ${{ inputs.expected-host-os }}
        EXPECTED_HOST_ARCH: ${{ inputs.expected-host-arch }}
        EXPECTED_FILE_PATTERN: ${{ inputs.expected-file-pattern }}
        SULTANC_BINARY: ${{ inputs.binary }}
        SULTANC_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: "$GITHUB_ACTION_PATH/verify.sh"
