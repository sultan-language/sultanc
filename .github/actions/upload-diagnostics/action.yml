# Diagnostic artifacts are bounded CI evidence, never release distributions.
name: SultanC Upload Diagnostics
description: >-
  Retain bounded diagnostics from failed qualification jobs for debugging and
  auditability.

inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Diagnostic path to upload.
    required: true

runs:
  using: composite
  steps:
    - name: Upload failure diagnostics
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: warn
        retention-days: 14
        compression-level: 6
        include-hidden-files: true
