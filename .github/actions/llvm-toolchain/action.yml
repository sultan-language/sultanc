# Restore, verify and activate the pinned SultanC LLVM development SDK.
name: SultanC LLVM Toolchain
description: >-
  Restore the pinned SultanC LLVM SDK from the Actions cache and verify its
  manifest and development contract. On a cache miss, a host whose declared
  method is "prebuilt" provisions it in this job from the pinned, SHA-256
  verified upstream archive; a "source" host requires the trusted
  provisioning workflow's cache. This action never writes the cache.

inputs:
  contracts:
    description: Path to the trusted CI contracts JSON.
    required: false
    default: .github/ci/contracts.json
  bootstrap:
    description: Run the host's declared prerequisite bootstrap first ("false" when the job already ran host-setup.sh).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Initialize registered host toolchain prerequisites
      if: ${{ inputs.bootstrap == 'true' }}
      shell: bash
      env:
        CONTRACTS: ${{ inputs.contracts }}
      run: '"$GITHUB_ACTION_PATH/bootstrap.sh" "$CONTRACTS"'

    - name: Resolve pinned LLVM cache contract
      id: contract
      shell: bash
      env:
        CONTRACTS: ${{ inputs.contracts }}
      run: '"$GITHUB_ACTION_PATH/setup.sh" resolve "$CONTRACTS"'

    - name: Restore pinned SultanC LLVM SDK
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.contract.outputs.toolchain_path }}
        key: ${{ steps.contract.outputs.cache_key }}

    - name: Verify and activate pinned LLVM SDK
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        CONTRACTS: ${{ inputs.contracts }}
      run: '"$GITHUB_ACTION_PATH/setup.sh" activate "$CONTRACTS" "$CACHE_HIT"'
