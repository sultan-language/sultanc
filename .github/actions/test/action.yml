# This wrapper executes repository-owned checks; it does not invent a test system.
name: SultanC Test
description: >-
  Run a named, trusted SultanC repository qualification command with strict shell
  failure handling.

inputs:
  name:
    description: Human-readable qualification name for the run summary.
    required: true
  command:
    description: Trusted repository qualification command to execute.
    required: true

runs:
  using: composite
  steps:
    - name: Run SultanC qualification
      shell: bash
      env:
        SULTANC_TEST_NAME: ${{ inputs.name }}
        SULTANC_TEST_COMMAND: ${{ inputs.command }}
      run: "$GITHUB_ACTION_PATH/run.sh"
