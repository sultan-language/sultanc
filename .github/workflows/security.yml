# Names SultanC's GitHub-native security analysis workflow.
name: SultanC Security

# Declares when security analysis runs.
on:
  # Scans changes proposed against main.
  pull_request:
    # Restricts pull-request scanning to main.
    branches:
      # Names the active integration branch.
      - main
  # Scans every integrated main revision.
  push:
    # Restricts automatic push scanning to main.
    branches:
      # Names the active integration branch.
      - main
  # Runs a periodic full scan even when the repository is quiet.
  schedule:
    # Runs every Monday at 04:41 UTC.
    - cron: '41 4 * * 1'
  # Allows maintainers to request an immediate security scan.
  workflow_dispatch:

# Grants the minimum permissions required by CodeQL.
permissions:
  # Allows CodeQL and checkout to read repository source.
  contents: read
  # Allows CodeQL results to be written into GitHub code scanning.
  security-events: write

# Prevents duplicate security scans for the same ref.
concurrency:
  # Groups scans by the source ref.
  group: sultanc-security-${{ github.ref }}
  # Cancels an obsolete scan when the same branch receives a newer commit.
  cancel-in-progress: true

# Declares security-analysis jobs.
jobs:
  # Analyzes the C bootstrap/foundation code supported by GitHub CodeQL.
  codeql-c:
    # Gives the job a precise security scope.
    name: CodeQL / C Bootstrap
    # Uses Ubuntu for the C/C++ CodeQL extractor and bootstrap build.
    runs-on: ubuntu-24.04
    # Prevents analysis from hanging indefinitely.
    timeout-minutes: 45

    # Starts CodeQL analysis steps.
    steps:
      # Checks out the revision under analysis.
      - name: Checkout SultanC
        # Pins actions/checkout v7.0.1 to its immutable full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Applies secure checkout behavior.
        with:
          # Prevents token persistence inside local Git configuration.
          persist-credentials: false

      # Initializes GitHub CodeQL before the C bootstrap is compiled.
      - name: Initialize CodeQL
        # Pins github/codeql-action v4.38.2 to its immutable full commit SHA.
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        # Configures CodeQL for SultanC's C bootstrap code.
        with:
          # Selects C/C++ extraction because CodeQL does not understand SultanC source yet.
          languages: c-cpp

      # Installs the native LLVM/C toolchain and builds Stage0 while CodeQL observes compilation.
      - name: Build Stage0 for CodeQL
        # Uses Bash because the repository build entry point is a shell script.
        shell: bash
        # Starts the security build.
        run: |
          # Fails on build errors, unset variables, or failed pipelines.
          set -euo pipefail
          # Installs LLVM only if the hosted image does not expose llvm-config.
          if ! command -v llvm-config >/dev/null 2>&1; then
            # Refreshes Ubuntu package metadata.
            sudo apt-get update
            # Installs the C compiler and LLVM bootstrap dependencies.
            sudo apt-get install -y clang llvm
          # Ends the dependency installation block.
          fi
          # Ensures the root build entry point is executable.
          chmod +x ./build.sh
          # Builds the C/LLVM bootstrap boundary for CodeQL extraction.
          ./build.sh stage0

      # Finalizes the database and uploads code-scanning findings to GitHub.
      - name: Analyze CodeQL database
        # Pins github/codeql-action v4.38.2 to its immutable full commit SHA.
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
