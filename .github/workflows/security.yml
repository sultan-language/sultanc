# CodeQL over the C Stage0 (bootstrap/, frozen; built by bootstrap/chain.sh
# --stage0-only); it does not analyze .sn sources.
name: SultanC Security

on:
  push:
    branches: [main]
    paths: ['bootstrap/**', '.github/workflows/security.yml']
  pull_request:
    branches: [main]
    paths: ['bootstrap/**', '.github/workflows/security.yml']
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: sultanc-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL / Stage0 C
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
        with:
          languages: c-cpp
      - name: LLVM 22 (apt.llvm.org)
        run: |
          curl -fsSL --retry 3 https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22
          sudo apt-get install -y llvm-22-dev libllvm22
      - name: Build Stage0
        env:
          LLVM_CONFIG: /usr/lib/llvm-22/bin/llvm-config
        run: sh bootstrap/chain.sh --stage0-only
      - uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
