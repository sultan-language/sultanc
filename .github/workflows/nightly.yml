# Nightly: the full tier of ci.yml (the seed route on every host, the LLVM
# fixpoint and cross-backend equality, the cross-target compilers, every test
# step) on main, with the opt-in test suites on (the self-host fixpoint inside
# the runner, RSS and allocation checks), built from the head of main every
# day. Pull requests build once and pushes to main check the fixpoint on
# Linux only, so this is where the whole matrix runs on main.
#
# A passing run qualifies the commit (the sultanc/qualification status), so
# the next promotion to beta of that commit runs no matrix (promote.yml).
# A scheduled run whose commit is already qualified is skipped, and its Fresh
# job links the run that qualified it: the same commit is not verified twice.
# A failed or cancelled run sets no status, so its commit is verified again.
# A manual dispatch always runs.
name: SultanC Nightly

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  fresh:
    name: Fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - name: Commit not yet qualified
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            covered=$(sh .github/ci/evidence.sh "$SHA")
            if [ -n "$covered" ]; then
              run=false
              echo "Skipped: $SHA is already qualified by $covered" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  ci:
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      scope: full
      extended: true
      qualify: true
