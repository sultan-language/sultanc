# Names the deeper qualification that runs after changes enter main.
name: SultanC Integration

# Declares the events that start integrated-main qualification.
on:
  # Runs after every commit pushed or merged into main.
  push:
    # Restricts automatic qualification to main.
    branches:
      # Names the active integration branch.
      - main
  # Allows maintainers to rerun integration qualification manually.
  workflow_dispatch:

# Gives the integration workflow read-only repository access.
permissions:
  # Allows source checkout and no repository writes.
  contents: read

# Controls simultaneous main qualification runs.
concurrency:
  # Groups runs by the integrated main ref.
  group: sultanc-integration-${{ github.ref }}
  # Preserves every integrated commit's result instead of cancelling older main runs.
  cancel-in-progress: false

# Declares integrated-main qualification jobs.
jobs:
  # Verifies explicit target selection and public examples on each native host.
  explicit-target:
    # Shows the selected target directly in GitHub's job list.
    name: Explicit Target / ${{ matrix.target }}
    # Uses the native hosted runner for this target.
    runs-on: ${{ matrix.runner }}
    # Allows time for the compiler build, bilingual examples, and self-host convergence.
    timeout-minutes: 120

    # Declares the supported target matrix.
    strategy:
      # Keeps each target's result independent.
      fail-fast: false
      # Starts the explicit host/target rows.
      matrix:
        # Declares exact target contracts.
        include:
          # Declares x86_64 Linux.
          - target: x86_64-linux
            # Uses Ubuntu x64.
            runner: ubuntu-24.04
            # Expects Linux.
            host_os: Linux
            # Expects x86_64.
            host_arch: x86_64
            # Expects ELF x86-64.
            file_pattern: 'ELF 64-bit.*x86-64'
          # Declares ARM64 Darwin.
          - target: arm64-darwin
            # Uses macOS ARM64.
            runner: macos-15
            # Expects Darwin.
            host_os: Darwin
            # Expects arm64.
            host_arch: arm64
            # Expects Mach-O ARM64.
            file_pattern: 'Mach-O 64-bit.*arm64'

    # Starts explicit-target qualification.
    steps:
      # Checks out the integrated main revision.
      - name: Checkout SultanC
        # Pins actions/checkout v7.0.1 to its immutable full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Applies secure checkout behavior.
        with:
          # Prevents credential persistence in local Git configuration.
          persist-credentials: false

      # Builds by explicitly selecting the registered target.
      - name: Build explicit target
        # Reuses the local SultanC build action.
        uses: ./.github/actions/build
        # Supplies the explicit target selection.
        with:
          # Passes the exact registered target name.
          target: ${{ matrix.target }}

      # Verifies the explicit target result.
      - name: Verify explicit target
        # Reuses the local target verifier.
        uses: ./.github/actions/target
        # Supplies the native target contract.
        with:
          # Names the selected SultanC target.
          target: ${{ matrix.target }}
          # Supplies the expected host OS.
          expected-host-os: ${{ matrix.host_os }}
          # Supplies the expected host architecture.
          expected-host-arch: ${{ matrix.host_arch }}
          # Supplies the expected executable format.
          expected-file-pattern: ${{ matrix.file_pattern }}

      # Exercises every mirrored English and Arabic example on the freshly built compiler.
      - name: Run bilingual examples
        # Reuses the local example qualification action.
        uses: ./.github/actions/examples

      # Requires every integrated main compiler to reproduce itself exactly before the push is accepted as healthy.
      - name: Verify self-host convergence
        # Reuses the same repository-owned convergence check used by deep qualification.
        uses: ./.github/actions/convergence
        # Keeps Stage2, Stage3, and Stage4 on the native target represented by this matrix row.
        with:
          # Supplies the exact supported target selected by this integration lane.
          target: ${{ matrix.target }}

      # Verifies that the complete integration lane leaves tracked source files unchanged.
      - name: Verify clean integration tree
        # Reuses the strict repository qualification wrapper.
        uses: ./.github/actions/test
        # Supplies the check command.
        with:
          # Names the integration cleanliness check.
          name: Integration source cleanliness
          # Rejects tracked source rewrites after compiler and example execution.
          command: git diff --exit-code

  # Reports failed integrated-main jobs without changing the qualification jobs themselves.
  report-failure:
    # Runs only after the target matrix finishes and only for failures on main.
    if: ${{ always() && needs.explicit-target.result == 'failure' && github.ref == 'refs/heads/main' }}
    # Waits for every explicit-target matrix row to finish before inspecting completed job logs.
    needs: explicit-target
    # Names the failure-only automation job clearly in the run UI.
    name: Report CI Failure
    # Uses one Linux runner only when main qualification has already failed.
    runs-on: ubuntu-24.04
    # Grants only the permissions required to inspect this run and maintain Issues.
    permissions:
      # Allows the reporter to read completed job metadata and logs.
      actions: read
      # Allows checkout of the repository-local reporter action.
      contents: read
      # Allows creation, update, and labeling of CI Issues.
      issues: write

    # Starts the failure-reporting steps.
    steps:
      # Checks out the exact integrated revision so the repository-local reporter can run.
      - name: Checkout SultanC
        # Pins actions/checkout v7.0.1 to its immutable full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Prevents the workflow token from being persisted into local Git configuration.
        with:
          persist-credentials: false

      # Creates or updates one deduplicated issue for each failed target job.
      - name: Create or update CI issue
        # Reuses the repository-owned GitHub Issue reporting action.
        uses: ./.github/actions/report-ci-failure
        # Labels integrated compiler failures by ownership.
        with:
          component-labels: compiler
