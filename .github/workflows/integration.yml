# Names the deeper qualification that runs after changes enter main.
name: SultanC Integration

# Declares the events that start integrated-main qualification.
on:
  # Runs after every commit pushed or merged into main.
  push:
    # Restricts automatic qualification to main.
    branches:
      # Names the active integration branch.
      - main
  # Allows maintainers to rerun integration qualification manually.
  workflow_dispatch:

# Gives the integration workflow read-only repository access.
permissions:
  # Allows source checkout and no repository writes.
  contents: read

# Controls simultaneous main qualification runs.
concurrency:
  # Groups runs by the integrated main ref.
  group: sultanc-integration-${{ github.ref }}
  # Preserves every integrated commit's result instead of cancelling older main runs.
  cancel-in-progress: false

# Declares integrated-main qualification jobs.
jobs:
  # Verifies explicit target selection on each native host.
  explicit-target:
    # Shows the selected target directly in GitHub's job list.
    name: Explicit Target / ${{ matrix.target }}
    # Uses the native hosted runner for this target.
    runs-on: ${{ matrix.runner }}
    # Prevents a hung integration build from running indefinitely.
    timeout-minutes: 60

    # Declares the supported target matrix.
    strategy:
      # Keeps each target's result independent.
      fail-fast: false
      # Starts the explicit host/target rows.
      matrix:
        # Declares exact target contracts.
        include:
          # Declares x86_64 Linux.
          - target: x86_64-linux
            # Uses Ubuntu x64.
            runner: ubuntu-24.04
            # Expects Linux.
            host_os: Linux
            # Expects x86_64.
            host_arch: x86_64
            # Expects ELF x86-64.
            file_pattern: 'ELF 64-bit.*x86-64'
          # Declares ARM64 Darwin.
          - target: arm64-darwin
            # Uses macOS ARM64.
            runner: macos-15
            # Expects Darwin.
            host_os: Darwin
            # Expects arm64.
            host_arch: arm64
            # Expects Mach-O ARM64.
            file_pattern: 'Mach-O 64-bit.*arm64'

    # Starts explicit-target qualification.
    steps:
      # Checks out the integrated main revision.
      - name: Checkout SultanC
        # Pins actions/checkout v7.0.1 to its immutable full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Applies secure checkout behavior.
        with:
          # Prevents credential persistence in local Git configuration.
          persist-credentials: false

      # Builds by explicitly selecting the registered target.
      - name: Build explicit target
        # Reuses the local SultanC build action.
        uses: ./.github/actions/build
        # Supplies the explicit target selection.
        with:
          # Passes the exact registered target name.
          target: ${{ matrix.target }}

      # Verifies the explicit target result.
      - name: Verify explicit target
        # Reuses the local target verifier.
        uses: ./.github/actions/target
        # Supplies the native target contract.
        with:
          # Names the selected SultanC target.
          target: ${{ matrix.target }}
          # Supplies the expected host OS.
          expected-host-os: ${{ matrix.host_os }}
          # Supplies the expected host architecture.
          expected-host-arch: ${{ matrix.host_arch }}
          # Supplies the expected executable format.
          expected-file-pattern: ${{ matrix.file_pattern }}

  # Verifies the earliest bootstrap boundary independently of the final compiler job.
  bootstrap-stage0:
    # Gives the bootstrap job a stable required-check name.
    name: Bootstrap / Stage0
    # Uses Linux x86_64 as the first integration bootstrap lane.
    runs-on: ubuntu-24.04
    # Prevents a broken bootstrap from consuming a runner indefinitely.
    timeout-minutes: 30

    # Starts Stage0 qualification.
    steps:
      # Checks out the integrated main revision.
      - name: Checkout SultanC
        # Pins checkout to the immutable v7.0.1 commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Applies secure checkout behavior.
        with:
          # Prevents credential persistence.
          persist-credentials: false

      # Prepares the compiler toolchain once before running the bootstrap stage.
      - name: Prepare build environment
        # Reuses SultanC's build action to ensure the host toolchain is present.
        uses: ./.github/actions/build

      # Runs the canonical Stage0 mode as a distinct integration gate.
      - name: Re-run Stage0 explicitly
        # Reuses the local bootstrap action.
        uses: ./.github/actions/bootstrap
        # Selects only the Stage0 boundary.
        with:
          # Requests the canonical Stage0 build mode.
          stage: stage0
