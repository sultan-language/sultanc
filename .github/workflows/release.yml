# Release: on a version tag (v*), build and test the compiler on all six
# hosts and attach one archive per host, with SHA-256 sums, to a draft
# GitHub release. Every archive holds the standard library (library/), the
# license and the readme, and:
#   linux-x86_64, macos-arm64   bin/sultanc: the Native-only compiler (no
#                               libLLVM), generated by LLVM from the C Stage0
#                               against the pinned SDK (the Native backend's
#                               own code runs `sultanc run` several times
#                               slower)
#   linux-arm64, macos-x86_64   the LLVM-enabled compiler (these hosts have
#                               no Native backend) in libexec/, the pinned
#                               libLLVM in lib/, and bin/sultanc, a launcher
#                               that points the loader at lib/
#   windows-x86_64, -arm64      bin\sultanc.exe and bin\LLVM-C.dll
# The LLVM SDKs come from the CI cache (.github/ci/llvm.lock), or are built.
name: SultanC Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must exist)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build / ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        include:
          - { host: linux-x86_64, runner: ubuntu-24.04, script: linux, route: native }
          - { host: linux-arm64, runner: ubuntu-24.04-arm, script: linux, route: llvm, lib: libLLVM.so.22.1, libvar: LD_LIBRARY_PATH }
          - { host: macos-arm64, runner: macos-15, script: macos, route: native }
          - { host: macos-x86_64, runner: macos-15-intel, script: macos, route: llvm, lib: libLLVM.dylib, libvar: DYLD_LIBRARY_PATH }
          - { host: windows-x86_64, runner: windows-2025, script: windows, route: llvm }
          - { host: windows-arm64, runner: windows-11-arm, script: windows, route: llvm }
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Every host builds from the C Stage0 against the pinned LLVM SDK.
      - name: LLVM SDK cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-sdk-22.1.8
          key: llvm-sdk-${{ matrix.host }}-${{ hashFiles('.github/ci/llvm.lock') }}
      - name: LLVM SDK
        if: matrix.script != 'windows'
        timeout-minutes: 340
        run: sh .github/ci/${{ matrix.script }}.sh llvm-sdk

      # Hosts with a Native backend: the Native-only compiler, LLVM-generated.
      - name: Native-only compiler
        if: matrix.route == 'native'
        timeout-minutes: 120
        run: sh .github/ci/${{ matrix.script }}.sh release-build

      # The other hosts: the LLVM-enabled compiler.
      - name: LLVM-enabled compiler
        if: matrix.route == 'llvm' && matrix.script != 'windows'
        timeout-minutes: 120
        run: sh .github/ci/${{ matrix.script }}.sh llvm-build
      - name: LLVM SDK
        if: matrix.script == 'windows'
        timeout-minutes: 340
        shell: pwsh
        run: ./.github/ci/windows.ps1 llvm-sdk
      - name: LLVM-enabled compiler
        if: matrix.script == 'windows'
        timeout-minutes: 120
        shell: pwsh
        run: ./.github/ci/windows.ps1 llvm-build

      - name: Tests
        if: matrix.script != 'windows'
        timeout-minutes: 60
        run: sh .github/ci/${{ matrix.script }}.sh test
      - name: Tests
        if: matrix.script == 'windows'
        timeout-minutes: 60
        shell: pwsh
        run: ./.github/ci/windows.ps1 test

      - name: Package
        if: matrix.script != 'windows'
        shell: bash
        run: |
          name=sultanc-$TAG-${{ matrix.host }}
          root=dist/$name
          mkdir -p "$root/bin"
          if [ "${{ matrix.route }}" = native ]; then
            cp build/sultanc "$root/bin/"
          else
            mkdir -p "$root/libexec" "$root/lib"
            cp build/sultanc "$root/libexec/"
            cp "$HOME/llvm-sdk-22.1.8/lib/${{ matrix.lib }}" "$root/lib/"
            {
              echo '#!/bin/sh'
              echo '# The LLVM-enabled SultanC compiler with the libLLVM shipped beside it.'
              echo 'here=$(cd "$(dirname "$0")/.." && pwd)'
              echo '${{ matrix.libvar }}="$here/lib${${{ matrix.libvar }}:+:$${{ matrix.libvar }}}"'
              echo 'export ${{ matrix.libvar }}'
              echo 'exec "$here/libexec/sultanc" "$@"'
            } > "$root/bin/sultanc"
            chmod +x "$root/bin/sultanc"
          fi
          cp -R library "$root/library"
          cp LICENSE README.md "$root/"
          "$root/bin/sultanc" version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Package
        if: matrix.script == 'windows'
        shell: pwsh
        run: |
          $name = "sultanc-$env:TAG-${{ matrix.host }}"
          $root = "dist\$name"
          New-Item -ItemType Directory -Force "$root\bin" | Out-Null
          Copy-Item build\sultanc.exe "$root\bin\"
          Copy-Item "$HOME\llvm-sdk-22.1.8\bin\LLVM-C.dll" "$root\bin\"
          Copy-Item -Recurse library "$root\library"
          Copy-Item LICENSE, README.md "$root\"
          & "$root\bin\sultanc.exe" version
          if ($LASTEXITCODE -ne 0) { throw "packaged compiler does not run" }
          Compress-Archive -Path $root -DestinationPath "dist\$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.host }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "SultanC $TAG" --generate-notes
