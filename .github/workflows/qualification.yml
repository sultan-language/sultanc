# Shared read-only qualification implementation for all protected branch profiles.
name: SultanC Qualification

on:
  workflow_call:
    inputs:
      candidate-ref:
        description: Immutable SHA or trusted ref to qualify.
        required: true
        type: string
      profile:
        description: "Destination profile: main, beta, or master."
        required: true
        type: string
      mode:
        description: "Qualification depth: pr, full, or deep."
        required: true
        type: string
    outputs:
      candidate_sha:
        description: Exact candidate commit that was qualified.
        value: ${{ jobs.required.outputs.candidate_sha }}
      promotion_ready:
        description: True only when all external CI contracts are activated.
        value: ${{ jobs.required.outputs.promotion_ready }}
      harness_sha:
        description: Immutable reusable-workflow harness revision.
        value: ${{ jobs.required.outputs.harness_sha }}

  workflow_dispatch:
    inputs:
      candidate-ref:
        description: Branch, tag, or commit to qualify.
        required: true
        default: main
        type: string
      profile:
        description: Qualification profile.
        required: true
        default: main
        type: choice
        options: [main, beta, master]
      mode:
        description: Qualification depth. Deep includes broad LLVM coverage.
        required: true
        default: deep
        type: choice
        options: [pr, full, deep]

permissions:
  contents: read

jobs:
  # Resolve a moving ref once; every later job consumes the resulting immutable SHA.
  resolve:
    name: Resolve Candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      matrix: ${{ steps.hosts.outputs.matrix }}
      broad_runner: ${{ steps.hosts.outputs.broad_runner }}
      broad_host_id: ${{ steps.hosts.outputs.broad_host_id }}
      broad_target: ${{ steps.hosts.outputs.broad_target }}
    steps:
      - name: Checkout immutable qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout candidate for immutable resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate-ref }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Validate request and record immutable candidate SHA
        id: resolve
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          MODE: ${{ inputs.mode }}
          REQUESTED_REF: ${{ inputs.candidate-ref }}
          CANDIDATE_DIR: candidate
        run: ./harness/.github/scripts/qualification-resolve.sh

      - name: Resolve native host matrix from trusted CI contract
        id: hosts
        shell: bash
        run: ./harness/.github/scripts/host-matrix.sh harness/.github/ci/contracts.json all

  # One job per registered host. Every step is selected by the host's gates
  # (ci_hosts[].checks in contracts.json): "required" steps gate the result,
  # "experimental" steps run with continue-on-error and are reported, "off"
  # steps are skipped. Workflows and scripts never branch on an OS name.
  native:
    name: Host / ${{ matrix.id }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    env:
      SULTANC_CI_HOST_ID: ${{ matrix.id }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Record harness and runner identity
        shell: bash
        env:
          HARNESS_SHA: ${{ job.workflow_sha }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          {
            echo "### Qualification harness"
            printf -- '- Harness SHA: `%s`\n' "$HARNESS_SHA"
            printf -- '- Candidate SHA: `%s`\n' "$CANDIDATE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize registered host prerequisites
        shell: bash
        run: ./harness/.github/scripts/host-setup.sh harness/.github/ci/contracts.json

      - name: Restore pinned LLVM SDK
        id: llvm_sdk
        if: ${{ !cancelled() && matrix.gates['llvm-sdk'] != 'off' }}
        continue-on-error: ${{ matrix.gates['llvm-sdk'] == 'experimental' }}
        uses: ./harness/.github/actions/llvm-toolchain
        with:
          contracts: harness/.github/ci/contracts.json
          bootstrap: "false"

      - name: Build C Stage0 (./build.sh stage0)
        id: c_stage0
        if: ${{ matrix.gates['c-stage0'] != 'off' }}
        continue-on-error: ${{ matrix.gates['c-stage0'] == 'experimental' }}
        uses: ./harness/.github/actions/build
        with:
          stage: stage0
          working-directory: candidate

      - name: Build from C Stage0 to Stage2 (./build.sh)
        id: c_stage2
        if: ${{ matrix.gates['c-stage2'] != 'off' }}
        continue-on-error: ${{ matrix.gates['c-stage2'] == 'experimental' }}
        uses: ./harness/.github/actions/build
        with:
          stage: stage2
          working-directory: candidate

      - name: Verify native compiler format
        id: compiler_format
        if: ${{ !cancelled() && matrix.gates['compiler-format'] != 'off' }}
        continue-on-error: ${{ matrix.gates['compiler-format'] == 'experimental' }}
        uses: ./harness/.github/actions/target
        with:
          target: ${{ matrix.target }}
          working-directory: candidate

      - name: Wasm-seed bootstrap (all declared C toolchains)
        id: seed
        if: ${{ !cancelled() && matrix.gates.seed != 'off' }}
        continue-on-error: ${{ matrix.gates.seed == 'experimental' }}
        shell: bash
        run: ./harness/.github/scripts/seed-bootstrap.sh candidate

      - name: Check-only self-compile with Stage1
        id: self_check
        if: ${{ !cancelled() && matrix.gates['self-check'] != 'off' }}
        continue-on-error: ${{ matrix.gates['self-check'] == 'experimental' }}
        shell: bash
        run: ./harness/.github/scripts/self-check.sh candidate

      - name: Self-host fixed point (./build.sh verify)
        id: fixpoint
        if: ${{ !cancelled() && matrix.gates.fixpoint != 'off' }}
        continue-on-error: ${{ matrix.gates.fixpoint == 'experimental' }}
        uses: ./harness/.github/actions/convergence
        with:
          working-directory: candidate

      - name: Run SultanC test suite (tools/tests/ci_run.sh)
        id: tests
        if: ${{ !cancelled() && matrix.gates.tests != 'off' }}
        continue-on-error: ${{ matrix.gates.tests == 'experimental' }}
        shell: bash
        run: ./harness/.github/scripts/test-suite.sh candidate full

      - name: Run portable test suite with Stage1
        id: tests_portable
        if: ${{ !cancelled() && matrix.gates['tests-portable'] != 'off' }}
        continue-on-error: ${{ matrix.gates['tests-portable'] == 'experimental' }}
        shell: bash
        run: ./harness/.github/scripts/test-suite.sh candidate portable

      - name: Exercise examples harness
        id: examples
        if: ${{ !cancelled() && matrix.gates.examples != 'off' }}
        continue-on-error: ${{ matrix.gates.examples == 'experimental' }}
        uses: ./harness/.github/actions/examples
        with:
          working-directory: candidate

      - name: Exercise explicit native backend
        id: smoke_native
        if: ${{ !cancelled() && matrix.gates['backend-smoke'] != 'off' }}
        continue-on-error: ${{ matrix.gates['backend-smoke'] == 'experimental' }}
        shell: bash
        env:
          SMOKE_TARGET: ${{ matrix.target }}
        run: ./harness/.github/scripts/backend-smoke.sh candidate native "$SMOKE_TARGET"

      - name: Exercise explicit LLVM backend
        id: smoke_llvm
        if: ${{ !cancelled() && matrix.gates['backend-smoke'] != 'off' }}
        continue-on-error: ${{ matrix.gates['backend-smoke'] == 'experimental' }}
        shell: bash
        env:
          SMOKE_TARGET: ${{ matrix.target }}
        run: ./harness/.github/scripts/backend-smoke.sh candidate llvm "$SMOKE_TARGET"

      - name: Verify clean candidate tree
        if: ${{ !cancelled() }}
        uses: ./harness/.github/actions/test
        with:
          name: Candidate source cleanliness
          command: git -C candidate diff --exit-code

      - name: Record check outcomes
        if: ${{ always() }}
        shell: bash
        env:
          GATES: ${{ toJSON(matrix.gates) }}
          OUTCOMES: >-
            {"llvm-sdk": "${{ steps.llvm_sdk.outcome }}",
             "c-stage0": "${{ steps.c_stage0.outcome }}",
             "c-stage2": "${{ steps.c_stage2.outcome }}",
             "compiler-format": "${{ steps.compiler_format.outcome }}",
             "seed": "${{ steps.seed.outcome }}",
             "self-check": "${{ steps.self_check.outcome }}",
             "fixpoint": "${{ steps.fixpoint.outcome }}",
             "tests": "${{ steps.tests.outcome }}",
             "tests-portable": "${{ steps.tests_portable.outcome }}",
             "examples": "${{ steps.examples.outcome }}",
             "backend-smoke": "${{ steps.smoke_native.outcome }}/${{ steps.smoke_llvm.outcome }}"}
        run: ./harness/.github/scripts/record-check-outcomes.sh

      - name: Retain host qualification diagnostics on failure
        if: ${{ failure() }}
        uses: ./harness/.github/actions/upload-diagnostics
        with:
          name: host-${{ matrix.id }}-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/sultanc-ci

  # Broad LLVM checks are skipped for fast main PR/full runs, but never for beta/master.
  llvm-contracts:
    name: LLVM Coverage Contracts
    if: ${{ inputs.profile != 'main' || inputs.mode == 'deep' }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      active: ${{ steps.contracts.outputs.active }}
      complete: ${{ steps.contracts.outputs.complete }}
      shards: ${{ steps.contracts.outputs.shards }}
    steps:
      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Validate all 34 LLVM coverage contracts
        id: contracts
        shell: bash
        run: ./harness/.github/scripts/llvm-contracts.sh

  llvm-broad:
    name: LLVM Broad / Shard ${{ matrix.shard }}
    if: >-
      ${{
        needs.llvm-contracts.result == 'success' &&
        needs.llvm-contracts.outputs.active == 'true'
      }}
    needs: [resolve, llvm-contracts]
    runs-on: ${{ fromJSON(needs.resolve.outputs.broad_runner) }}
    env:
      SULTANC_CI_HOST_ID: ${{ needs.resolve.outputs.broad_host_id }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: >-
          ${{ fromJSON(
            needs.llvm-contracts.outputs.shards || '[0,1,2,3]'
          ) }}
    steps:
      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Initialize registered host prerequisites
        shell: bash
        run: ./harness/.github/scripts/host-setup.sh harness/.github/ci/contracts.json

      - name: Restore pinned LLVM SDK
        uses: ./harness/.github/actions/llvm-toolchain
        with:
          contracts: harness/.github/ci/contracts.json
          bootstrap: "false"

      - name: Build host compiler once for this LLVM shard
        uses: ./harness/.github/actions/build
        with:
          target: ${{ needs.resolve.outputs.broad_target }}
          working-directory: candidate

      - name: Record compiler target inventory
        shell: bash
        env:
          CANDIDATE_DIR: candidate
          SHARD: ${{ matrix.shard }}
        run: ./harness/.github/scripts/record-target-inventory.sh

      - name: Generate and inspect assigned LLVM outputs
        shell: bash
        run: >-
          ./harness/.github/scripts/llvm-shard.sh
          candidate '${{ matrix.shard }}'

      - name: Verify clean candidate tree
        shell: bash
        run: git -C candidate diff --exit-code

      - name: Retain LLVM shard diagnostics on failure
        if: ${{ failure() }}
        uses: ./harness/.github/actions/upload-diagnostics
        with:
          name: llvm-shard-${{ matrix.shard }}-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/sultanc-ci

  # Required remains green only when every mandatory job result is acceptable.
  required:
    name: Qualification Required
    if: ${{ always() }}
    needs: [resolve, native, llvm-contracts, llvm-broad]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ needs.resolve.outputs.sha }}
      promotion_ready: ${{ steps.readiness.outputs.ready }}
      harness_sha: ${{ job.workflow_sha }}
    steps:
      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Enforce mandatory job results
        shell: bash
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          LLVM_CONTRACTS_RESULT: ${{ needs.llvm-contracts.result }}
          LLVM_BROAD_RESULT: ${{ needs.llvm-broad.result }}
          LLVM_ACTIVE: ${{ needs.llvm-contracts.outputs.active }}
          LLVM_COMPLETE: ${{ needs.llvm-contracts.outputs.complete }}
          PROFILE: ${{ inputs.profile }}
          MODE: ${{ inputs.mode }}
        run: ./harness/.github/scripts/qualification-required.sh

      - name: Record contract readiness
        id: readiness
        shell: bash
        run: ./harness/.github/scripts/qualification-readiness.sh

      - name: Record final qualification identity
        shell: bash
        run: |
          {
            echo "### Qualification result"
            echo '- Candidate SHA: `${{ needs.resolve.outputs.sha }}`'
            echo '- Harness SHA: `${{ job.workflow_sha }}`'
            echo '- Required jobs: `PASS`'
          } >> "$GITHUB_STEP_SUMMARY"
