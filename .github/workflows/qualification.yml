# Names the manually requested deep qualification workflow.
name: SultanC Qualification

# Keeps deep qualification opt-in until beta/master promotion policy is enabled.
on:
  # Allows maintainers to start qualification from the GitHub Actions UI.
  workflow_dispatch:
    # Declares the inputs shown in the manual-run dialog.
    inputs:
      # Lets maintainers qualify any trusted repository ref.
      ref:
        # Explains which commit, branch, or tag will be checked out.
        description: Branch, tag, or commit to qualify.
        # Requires an explicit ref to avoid qualifying an accidental default.
        required: true
        # Uses main as the normal qualification candidate.
        default: main
        # Treats the input as a normal text field.
        type: string

# Gives deep qualification read-only access.
permissions:
  # Allows source checkout only.
  contents: read

# Prevents duplicate deep qualification of the same requested ref.
concurrency:
  # Groups qualification by the manually selected ref.
  group: sultanc-qualification-${{ inputs.ref }}
  # Cancels an obsolete manual qualification if the same ref is restarted.
  cancel-in-progress: true

# Declares deep qualification jobs.
jobs:
  # Builds every supported target explicitly from the selected ref.
  targets:
    # Shows the exact target in the qualification result list.
    name: Target / ${{ matrix.target }}
    # Uses the matching native host.
    runs-on: ${{ matrix.runner }}
    # Allows additional time for deep qualification.
    timeout-minutes: 90

    # Declares the supported target matrix.
    strategy:
      # Keeps all target results visible.
      fail-fast: false
      # Starts the explicit target rows.
      matrix:
        # Declares the exact target/runner mapping.
        include:
          # Declares x86_64 Linux.
          - target: x86_64-linux
            # Uses Ubuntu x64.
            runner: ubuntu-24.04
            # Expects Linux.
            host_os: Linux
            # Expects x86_64.
            host_arch: x86_64
            # Expects ELF x86-64.
            file_pattern: 'ELF 64-bit.*x86-64'
          # Declares ARM64 Darwin.
          - target: arm64-darwin
            # Uses macOS ARM64.
            runner: macos-15
            # Expects Darwin.
            host_os: Darwin
            # Expects arm64.
            host_arch: arm64
            # Expects Mach-O ARM64.
            file_pattern: 'Mach-O 64-bit.*arm64'

    # Starts target qualification.
    steps:
      # Checks out exactly the ref requested by the maintainer.
      - name: Checkout qualification ref
        # Pins checkout to the immutable v7.0.1 commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Configures checkout for the selected candidate.
        with:
          # Checks out the requested branch, tag, or commit.
          ref: ${{ inputs.ref }}
          # Prevents workflow-token persistence.
          persist-credentials: false

      # Builds the explicit SultanC target.
      - name: Build qualification target
        # Reuses the local build action.
        uses: ./.github/actions/build
        # Supplies the selected target.
        with:
          # Passes the exact registered target.
          target: ${{ matrix.target }}

      # Verifies target identity and native binary format.
      - name: Verify qualification target
        # Reuses the local target verifier.
        uses: ./.github/actions/target
        # Supplies the target contract.
        with:
          # Names the target.
          target: ${{ matrix.target }}
          # Supplies the host OS.
          expected-host-os: ${{ matrix.host_os }}
          # Supplies the host architecture.
          expected-host-arch: ${{ matrix.host_arch }}
          # Supplies the binary-format expectation.
          expected-file-pattern: ${{ matrix.file_pattern }}

      # Verifies that qualification left tracked sources unchanged.
      - name: Verify clean qualification tree
        # Reuses the strict repository qualification wrapper.
        uses: ./.github/actions/test
        # Supplies the check command.
        with:
          # Names the cleanliness check.
          name: Qualification source cleanliness
          # Rejects tracked source rewrites.
          command: git diff --exit-code
