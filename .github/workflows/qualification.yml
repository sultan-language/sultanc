# Shared read-only qualification implementation for all protected branch profiles.
name: SultanC Qualification

on:
  workflow_call:
    inputs:
      candidate-ref:
        description: Immutable SHA or trusted ref to qualify.
        required: true
        type: string
      profile:
        description: "Destination profile: main, beta, or master."
        required: true
        type: string
      mode:
        description: "Qualification depth: pr, full, or deep."
        required: true
        type: string
    outputs:
      candidate_sha:
        description: Exact candidate commit that was qualified.
        value: ${{ jobs.required.outputs.candidate_sha }}
      promotion_ready:
        description: True only when all external CI contracts are activated.
        value: ${{ jobs.required.outputs.promotion_ready }}
      harness_sha:
        description: Immutable reusable-workflow harness revision.
        value: ${{ jobs.required.outputs.harness_sha }}

  workflow_dispatch:
    inputs:
      candidate-ref:
        description: Branch, tag, or commit to qualify.
        required: true
        default: main
        type: string
      profile:
        description: Qualification profile.
        required: true
        default: main
        type: choice
        options: [main, beta, master]
      mode:
        description: Qualification depth. Deep includes broad LLVM coverage.
        required: true
        default: deep
        type: choice
        options: [pr, full, deep]

permissions:
  contents: read

jobs:
  # Resolve a moving ref once; every later job consumes the resulting immutable SHA.
  resolve:
    name: Resolve Candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout immutable qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout candidate for immutable resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate-ref }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Validate request and record immutable candidate SHA
        id: resolve
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          MODE: ${{ inputs.mode }}
          REQUESTED_REF: ${{ inputs.candidate-ref }}
          CANDIDATE_DIR: candidate
        run: ./harness/.github/scripts/qualification-resolve.sh

  # Native lanes prove both host targets and exercise native, LLVM, and interpreter paths.
  native:
    name: Native Host / ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-24.04
            host_os: Linux
            host_arch: x86_64
            file_pattern: 'ELF 64-bit.*x86-64'
          - target: arm64-darwin
            runner: macos-15
            host_os: Darwin
            host_arch: arm64
            file_pattern: 'Mach-O 64-bit.*arm64'
    steps:
      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Record harness and runner identity
        shell: bash
        run: |
          {
            echo "### Qualification harness"
            echo '- Harness SHA: `${{ job.workflow_sha }}`'
            echo '- Candidate SHA: `${{ needs.resolve.outputs.sha }}`'
            printf -- '- Runner: `%s / %s`\n' "$(uname -s)" "$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore or provision pinned LLVM toolchain
        uses: ./harness/.github/actions/llvm-toolchain
        with:
          contracts: harness/.github/ci/contracts.json

      - name: Build native host compiler
        uses: ./harness/.github/actions/build
        with:
          target: ${{ matrix.target }}
          working-directory: candidate

      - name: Verify native host compiler
        uses: ./harness/.github/actions/target
        with:
          target: ${{ matrix.target }}
          expected-host-os: ${{ matrix.host_os }}
          expected-host-arch: ${{ matrix.host_arch }}
          expected-file-pattern: ${{ matrix.file_pattern }}
          working-directory: candidate

      - name: Exercise default compile and run behavior
        uses: ./harness/.github/actions/examples
        with:
          working-directory: candidate

      - name: Exercise explicit native backend
        shell: bash
        run: >-
          ./harness/.github/scripts/backend-smoke.sh
          candidate native '${{ matrix.target }}'

      - name: Exercise explicit LLVM backend
        shell: bash
        run: >-
          ./harness/.github/scripts/backend-smoke.sh
          candidate llvm '${{ matrix.target }}'

      - name: Run delivered SultanC test suite
        shell: bash
        run: ./harness/.github/scripts/test-suite.sh candidate

      - name: Verify self-host convergence
        if: ${{ inputs.mode != 'pr' }}
        uses: ./harness/.github/actions/convergence
        with:
          target: ${{ matrix.target }}
          working-directory: candidate

      - name: Verify clean candidate tree
        uses: ./harness/.github/actions/test
        with:
          name: Candidate source cleanliness
          command: git -C candidate diff --exit-code

      - name: Retain native qualification diagnostics on failure
        if: ${{ failure() }}
        uses: ./harness/.github/actions/upload-diagnostics
        with:
          name: native-${{ matrix.target }}-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/sultanc-ci

  # Broad LLVM checks are skipped for fast main PR/full runs, but never for beta/master.
  llvm-contracts:
    name: LLVM Coverage Contracts
    if: ${{ inputs.profile != 'main' || inputs.mode == 'deep' }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      active: ${{ steps.contracts.outputs.active }}
      complete: ${{ steps.contracts.outputs.complete }}
      shards: ${{ steps.contracts.outputs.shards }}
    steps:
      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Validate all 34 LLVM coverage contracts
        id: contracts
        shell: bash
        run: ./harness/.github/scripts/llvm-contracts.sh

  llvm-broad:
    name: LLVM Broad / Shard ${{ matrix.shard }}
    if: >-
      ${{
        needs.llvm-contracts.result == 'success' &&
        needs.llvm-contracts.outputs.active == 'true'
      }}
    needs: [resolve, llvm-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: >-
          ${{ fromJSON(
            needs.llvm-contracts.outputs.shards || '[0,1,2,3]'
          ) }}
    steps:
      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Restore or provision pinned LLVM toolchain
        uses: ./harness/.github/actions/llvm-toolchain
        with:
          contracts: harness/.github/ci/contracts.json

      - name: Build host compiler once for this LLVM shard
        uses: ./harness/.github/actions/build
        with:
          target: x86_64-linux
          working-directory: candidate

      - name: Record compiler target inventory
        shell: bash
        env:
          CANDIDATE_DIR: candidate
          SHARD: ${{ matrix.shard }}
        run: ./harness/.github/scripts/record-target-inventory.sh

      - name: Generate and inspect assigned LLVM outputs
        shell: bash
        run: >-
          ./harness/.github/scripts/llvm-shard.sh
          candidate '${{ matrix.shard }}'

      - name: Verify clean candidate tree
        shell: bash
        run: git -C candidate diff --exit-code

      - name: Retain LLVM shard diagnostics on failure
        if: ${{ failure() }}
        uses: ./harness/.github/actions/upload-diagnostics
        with:
          name: llvm-shard-${{ matrix.shard }}-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/sultanc-ci

  # Required remains green only when every mandatory job result is acceptable.
  required:
    name: Qualification Required
    if: ${{ always() }}
    needs: [resolve, native, llvm-contracts, llvm-broad]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ needs.resolve.outputs.sha }}
      promotion_ready: ${{ steps.readiness.outputs.ready }}
      harness_sha: ${{ job.workflow_sha }}
    steps:
      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Enforce mandatory job results
        shell: bash
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          LLVM_CONTRACTS_RESULT: ${{ needs.llvm-contracts.result }}
          LLVM_BROAD_RESULT: ${{ needs.llvm-broad.result }}
          LLVM_ACTIVE: ${{ needs.llvm-contracts.outputs.active }}
          LLVM_COMPLETE: ${{ needs.llvm-contracts.outputs.complete }}
          PROFILE: ${{ inputs.profile }}
          MODE: ${{ inputs.mode }}
        run: ./harness/.github/scripts/qualification-required.sh

      - name: Record contract readiness
        id: readiness
        shell: bash
        run: ./harness/.github/scripts/qualification-readiness.sh

      - name: Record final qualification identity
        shell: bash
        run: |
          {
            echo "### Qualification result"
            echo '- Candidate SHA: `${{ needs.resolve.outputs.sha }}`'
            echo '- Harness SHA: `${{ job.workflow_sha }}`'
            echo '- Required jobs: `PASS`'
          } >> "$GITHUB_STEP_SUMMARY"
