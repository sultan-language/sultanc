# SultanC CI: one definition of every job, in tiers. The same .github is on
# main, beta and master (promotion carries the qualified files to each
# branch); each entry workflow filters on its own branch.
#
# Each build of the compiler is one compile of compiler/main.sn by the
# previous compiler (N-1): the cached compiler of the base commit, or Stage1
# from the committed seed on a cold runner. The self-host fixpoint is checked
# when a commit lands on main, the wide matrix runs nightly, and the frozen C
# Stage0 runs only in the release check (chain.yml).
#
#   trigger                         tier     runs
#   pull request into main          pr       Build / linux-x86_64: one build
#                                            from the previous compiler, the
#                                            test suite; plus the hosts of the
#                                            components it changes (plan.py,
#                                            COMPONENTS)
#   push to main                    main     Seed / linux-x86_64: seed ->
#                                            Stage1 -> S2 -> S3, S2 == S3, the
#                                            seed reproduced, the test suite;
#                                            caches the compiler for pull
#                                            requests based on the commit
#   documentation-only change       docs     docs check only (no compiler build)
#   manual dispatch                 scope    full (default) or main
#   workflow_call                   scope    nightly.yml, promote.yml, beta.yml
#                                            (full, opt-in suites on, qualify)
#
# Qualification: a full-tier run called with `qualify: true` that passes its
# gate sets the commit status `sultanc/qualification` on the commit it tested
# (`ref`). That status is the only evidence promotion accepts
# (.github/ci/evidence.sh): a passing pr or main run qualifies nothing.
#
# The full tier is every check this workflow has:
#   lint         workflows (actionlint), CI shell scripts (shellcheck), Python helpers
#   docs         every relative Markdown link resolves (docs_check.py)
#   seed         the seed route with only a C compiler (no LLVM) on all six
#                hosts; native hosts: S2 == S3 and the test suite; the
#                committed seed must equal what the sources rebuild
#   seed-update  bootstrap.c --update-seed into a scratch directory, then a
#                clean bootstrap from it (the committed seed is never changed)
#   llvm-sdk     the pinned LLVM SDK per host (.github/ci/llvm.lock), cached
#                on llvm.lock alone
#   llvm         native hosts: LLVM-enabled S2 == S3, the LLVM fixpoint,
#                cross-backend equality, the test suite; linux-x86_64 also
#                builds the cross-target compilers
#   cross-run    the cross-built compilers run on the hosts without a Native
#                backend (version, check, run)
#   summary      the plan, one table of every host and route, and the gate:
#                every planned job must succeed and every job left out of the
#                plan must be skipped, so skipped, failed and passed stay
#                distinct (a skip is never reported as a pass)
#   qualified    with qualify: the commit status, when the full tier passed
#
# Superseded push and pull-request runs are cancelled (the newest commit is
# the one that matters); scheduled, dispatched and qualification runs always
# finish. Each job step has its own timeout, sized from a normal run, so a
# hang fails within the step that hangs. Builds of the compiler also have a
# per-command limit inside build.sh (SULTANC_CI_COMPILE_TIMEOUT).
# Compilers and test logs are uploaded as artifacts.
#
# This workflow never merges, promotes, tags or publishes anything: its token
# can only read, except the commit status of the qualified job. Promotion is
# promote.yml; a release is release.yml (a draft the owner publishes).
name: SultanC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: full = every route on every host; main = the push-to-main tier
        type: choice
        options: [full, main]
        default: full
      extended:
        description: Run the opt-in test suites (convergence, RSS, allocations)
        type: boolean
        default: false
  workflow_call:
    inputs:
      scope:
        type: string
        default: full
      extended:
        type: boolean
        default: false
      ref:
        # The commit to test (a full SHA); empty: the commit of the caller.
        type: string
        default: ''
      qualify:
        # Set the sultanc/qualification status on that commit when the full
        # tier passes.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sultanc-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || 'head' }}-${{ inputs.scope || 'auto' }}-${{ inputs.extended && 'ext' || 'std' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  # Opt-in suites of tests/runner (tests/runner/suites/system.sn).
  SULTANC_TEST_CONVERGENCE: ${{ inputs.extended && '1' || '' }}
  SULTANC_TEST_RSS: ${{ inputs.extended && '1' || '' }}
  SULTANC_TEST_ALLOCATIONS: ${{ inputs.extended && '1' || '' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      docs: ${{ steps.plan.outputs.docs }}
      build: ${{ steps.plan.outputs.build }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      seed: ${{ steps.plan.outputs.seed }}
      seed_matrix: ${{ steps.plan.outputs.seed_matrix }}
      seed_update: ${{ steps.plan.outputs.seed_update }}
      llvm: ${{ steps.plan.outputs.llvm }}
      llvm_matrix: ${{ steps.plan.outputs.llvm_matrix }}
      cross: ${{ steps.plan.outputs.cross }}
      cross_run_matrix: ${{ steps.plan.outputs.cross_run_matrix }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github
      - name: Changed files
        # From the API, so the plan needs no history. Unknown (an error, a
        # new branch, a list the API truncates) plans every component, never
        # documentation-only.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out="$RUNNER_TEMP/changed-files.txt"
          : > "$out"
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > "$out" || : > "$out"
            # The pull-request files API lists at most 3000 files.
            [ "$(wc -l < "$out")" -lt 3000 ] || : > "$out"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename' > "$out" || : > "$out"
            # The compare API lists at most 300 files.
            [ "$(wc -l < "$out")" -lt 300 ] || : > "$out"
          fi
          echo "CHANGED_FILES=$out" >> "$GITHUB_ENV"
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
        run: python3 .github/ci/plan.py

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: actionlint
        # The pinned release, checked against its published SHA-256
        # (actionlint_<version>_checksums.txt of the release). Runner labels
        # newer than the pinned release go in .github/actionlint.yaml.
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck -x .github/ci/linux.sh .github/ci/macos.sh .github/ci/common.sh .github/ci/no_release.sh .github/ci/evidence.sh build.sh bootstrap/chain.sh
      - name: Python helpers
        run: python3 -m py_compile .github/ci/report.py .github/ci/summary.py .github/ci/plan.py .github/ci/docs_check.py .github/ci/release.py
      - name: SDK cache path matches llvm.lock
        run: |
          . .github/ci/llvm.lock
          bad=$(grep -n 'llvm-sdk-[0-9]' .github/workflows/*.yml | grep -v "llvm-sdk-$LLVM_VERSION" || true)
          if [ -n "$bad" ]; then
            echo "::error::workflow SDK paths must name llvm-sdk-$LLVM_VERSION (llvm.lock):"
            echo "$bad"
            exit 1
          fi
      - name: No workflow publishes a release
        # CI only verifies: no merge, promotion, tag or published release; only
        # release.yml's publish job creates a draft (no_release.sh).
        run: sh .github/ci/no_release.sh

  docs:
    name: Docs
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Relative links resolve
        run: python3 .github/ci/docs_check.py .

  build:
    name: Build / ${{ matrix.host }}
    needs: [plan, lint]
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    env:
      # The previous compiler: the one the push of the base commit cached
      # (seed job); without it build.sh starts from the seed.
      SULTANC_PREVIOUS: ci-previous/sultanc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Compiler of the base commit
        if: matrix.native
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ci-previous/sultanc
          key: sultanc-${{ matrix.host }}-${{ github.event.pull_request.base.sha || github.event.before || 'none' }}
      - name: Compiler from the previous compiler
        if: matrix.script != 'windows'
        timeout-minutes: 80
        run: sh .github/ci/${{ matrix.script }}.sh build
      - name: Stage1 from the seed (MSVC, clang-cl, MinGW)
        if: matrix.script == 'windows'
        timeout-minutes: 100
        shell: pwsh
        run: ./.github/ci/windows.ps1 seed
      - name: Tests
        if: matrix.native
        timeout-minutes: 60
        run: sh .github/ci/${{ matrix.script }}.sh test
      - name: Upload test results
        if: always() && matrix.native
        # Evidence only: a problem uploading it never fails the job.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-build-${{ matrix.host }}
          path: |
            build/tests-result.json
            build/tests-junit.xml
            build/tests-ci/*.log
            build/ispeak-tests-*/summary.txt
            build/ispeak-tests-*/*.log
            build/ispeak-tests-*/*.diff
            build/ispeak-tests-*/*.stderr
            build/tests-sultanc/*.out
            build/tests-sultanc/*.err
          retention-days: 14
          if-no-files-found: ignore

  seed:
    name: Seed / ${{ matrix.host }}
    needs: [plan, lint]
    if: needs.plan.outputs.seed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.extended && 260 || 150 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.seed_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Seed bootstrap, S2 == S3
        if: matrix.script != 'windows'
        timeout-minutes: 100
        run: sh .github/ci/${{ matrix.script }}.sh seed-build
      - name: Seed is reproducible
        if: matrix.script != 'windows'
        timeout-minutes: 30
        run: sh .github/ci/${{ matrix.script }}.sh seed-check
      - name: Stage1 from the seed (MSVC, clang-cl, MinGW)
        if: matrix.script == 'windows'
        timeout-minutes: 120
        shell: pwsh
        run: ./.github/ci/windows.ps1 seed
      - name: Tests
        if: matrix.native
        # The opt-in suites (extended: nightly, qualification) rebuild the
        # compiler for self-host convergence and three times for RSS.
        timeout-minutes: ${{ inputs.extended && 150 || 60 }}
        run: sh .github/ci/${{ matrix.script }}.sh test
      - name: Keep the compiler for pull requests
        # The previous compiler of the pull requests based on this commit.
        if: matrix.native && (github.event_name == 'push' || github.event_name == 'schedule')
        run: |
          mkdir -p ci-previous
          cp build/sultanc ci-previous/sultanc
      - name: Cache the compiler
        if: matrix.native && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ci-previous/sultanc
          key: sultanc-${{ matrix.host }}-${{ inputs.ref || github.sha }}
      - name: Upload compiler
        if: matrix.native
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sultanc-seed-${{ matrix.host }}
          path: build/sultanc
          retention-days: 7
          if-no-files-found: warn
      - name: Upload test results
        if: always() && matrix.native
        # Evidence only: a problem uploading it never fails the job.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-seed-${{ matrix.host }}
          path: |
            build/tests-result.json
            build/tests-junit.xml
            build/tests-ci/*.log
            build/ispeak-tests-*/summary.txt
            build/ispeak-tests-*/*.log
            build/ispeak-tests-*/*.diff
            build/ispeak-tests-*/*.stderr
            build/tests-sultanc/*.out
            build/tests-sultanc/*.err
          retention-days: 14
          if-no-files-found: ignore

  seed-update:
    name: Seed update / linux-x86_64
    needs: [plan, lint]
    if: needs.plan.outputs.seed_update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Update the seed, then bootstrap from it
        timeout-minutes: 80
        run: sh .github/ci/linux.sh seed-update

  llvm-sdk:
    name: LLVM SDK / ${{ matrix.host }}
    needs: [plan, lint]
    if: needs.plan.outputs.llvm == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.llvm_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: LLVM SDK cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/llvm-sdk-22.1.8
          key: llvm-sdk-${{ matrix.host }}-${{ hashFiles('.github/ci/llvm.lock') }}
          lookup-only: true
      - name: Build the LLVM SDK
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 110
        run: sh .github/ci/${{ matrix.script }}.sh llvm-sdk

  llvm:
    name: LLVM / ${{ matrix.host }}
    needs: [plan, llvm-sdk]
    if: needs.plan.outputs.llvm == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.extended && 390 || 300 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.llvm_matrix) }}
    env:
      SULTANC_PREVIOUS: ci-previous/sultanc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: LLVM SDK
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/llvm-sdk-22.1.8
          key: llvm-sdk-${{ matrix.host }}-${{ hashFiles('.github/ci/llvm.lock') }}
          fail-on-cache-miss: true
      - name: Compiler of the base commit
        if: matrix.mode == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ci-previous/sultanc
          key: sultanc-${{ matrix.host }}-${{ github.event.pull_request.base.sha || github.event.before || 'none' }}
      - name: LLVM-enabled compiler from the previous compiler
        if: matrix.mode == 'build'
        timeout-minutes: 80
        run: sh .github/ci/${{ matrix.script }}.sh llvm-build
      - name: LLVM fixpoint and cross-backend
        if: matrix.mode == 'verify'
        timeout-minutes: 200
        run: sh .github/ci/${{ matrix.script }}.sh llvm-verify
      - name: Tests
        timeout-minutes: ${{ inputs.extended && 150 || 60 }}
        run: sh .github/ci/${{ matrix.script }}.sh test
      - name: Cross-target compilers
        if: matrix.cross_build
        timeout-minutes: 120
        run: sh .github/ci/linux.sh cross
      - name: Upload cross-target compilers
        if: matrix.cross_build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sultanc-cross
          path: build/cross
          retention-days: 7
          if-no-files-found: error
      - name: Upload compiler
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sultanc-llvm-${{ matrix.host }}
          path: build/sultanc
          retention-days: 7
          if-no-files-found: warn
      - name: Upload test results
        if: always()
        # Evidence only: a problem uploading it never fails the job.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-llvm-${{ matrix.host }}
          path: |
            build/tests-result.json
            build/tests-junit.xml
            build/tests-ci/*.log
            build/ispeak-tests-*/summary.txt
            build/ispeak-tests-*/*.log
            build/ispeak-tests-*/*.diff
            build/ispeak-tests-*/*.stderr
            build/tests-sultanc/*.out
            build/tests-sultanc/*.err
          retention-days: 14
          if-no-files-found: ignore

  cross-run:
    name: Cross run / ${{ matrix.host }}
    needs: [plan, llvm]
    if: needs.plan.outputs.cross == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cross_run_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sultanc-cross
          path: build/cross
      - name: The compiler built for this host runs
        if: matrix.script != 'windows'
        timeout-minutes: 20
        run: sh .github/ci/${{ matrix.script }}.sh cross-run
      - name: The compiler built for this host runs
        if: matrix.script == 'windows'
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/ci/windows.ps1 cross-run

  summary:
    name: Summary
    if: always()
    needs: [plan, lint, docs, build, seed, seed-update, llvm-sdk, llvm, cross-run]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tests-*
          path: results
      - name: Cross-host summary
        env:
          RESULTS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: python3 .github/ci/summary.py results
      - name: Gate
        # Every planned job must succeed; a job the plan left out must be
        # skipped. Without a plan nothing is known, so the gate fails.
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          if needs.get("plan", {}).get("result") != "success" or not os.environ.get("EXPECTED"):
              print("no CI plan: the plan job", needs.get("plan", {}).get("result", "did not run"))
              sys.exit(1)
          expected = set(json.loads(os.environ["EXPECTED"]))
          bad = {}
          for job, info in needs.items():
              result = info["result"]
              if job in expected and result != "success":
                  bad[job] = f"{result} (planned)"
              elif job not in expected and result != "skipped":
                  bad[job] = f"{result} (not planned)"
          if bad:
              print("failed jobs:", bad)
              sys.exit(1)
          print("planned jobs passed:", sorted(expected))
          print("not planned (skipped):", sorted(set(needs) - expected))
          EOF

  qualified:
    name: Qualified
    needs: [plan, summary]
    # Only a full-tier run whose gate passed, and only when the caller asks.
    if: inputs.qualify && needs.plan.outputs.tier == 'full' && needs.summary.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Commit status sultanc/qualification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.ref || github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state=success -f context=sultanc/qualification \
            -f description="full tier passed" -f target_url="$URL" > /dev/null
          echo "Qualified: $SHA ($URL)" >> "$GITHUB_STEP_SUMMARY"
