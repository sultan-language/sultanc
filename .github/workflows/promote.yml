# Promotion: main -> beta, beta -> master. Started by hand ("Run workflow",
# from main); GitHub lets only people with write access start a run. Nothing
# else moves beta or master, and nothing ever pushes to them directly.
#
# The rules:
#   - test the exact tree, then move the branch to it;
#   - the wide matrix runs once per tree, never again for a promotion of the
#     same tree (every presubmit host is a post-submit host);
#   - nothing is forced: every move keeps the target's history.
#
#   target  source  needs                                     then
#   beta    main    the head of main qualified: a passing     main merged into beta
#                   nightly, or the full tier run here now
#   master  beta    the head of beta qualified (always so,    beta merged into master
#                   unless beta was moved by hand)
#
# The commit is the head of the source branch when the run starts; a push to
# main during qualification does not change what is promoted. When the target
# is an ancestor of the commit, the target fast-forwards to it. Otherwise the
# move is a merge commit whose tree is the qualified commit's tree, with the
# target and the commit as parents: the target ends with exactly the tested
# files, keeps its history, and the merge carries the commit's qualification
# (same tree). A target whose tree already equals the commit's is left alone.
#
# Releases are not made here: the owner tags master, and release.yml builds a
# draft release that the owner publishes.
#
# Setup (CI.md, "Repository settings"): the secret PROMOTE_TOKEN in the
# environment `promotion` (a fine-grained token of the owner: this repository,
# Contents read and write), and a ruleset on beta and master that allows
# updates only by the owner (bypass: repository admin), with no force push.
name: SultanC Promote

on:
  workflow_dispatch:
    inputs:
      target:
        description: beta (from main) or master (from beta)
        type: choice
        options: [beta, master]
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: sultanc-promote
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      sha: ${{ steps.resolve.outputs.sha }}
      exists: ${{ steps.resolve.outputs.exists }}
      identical: ${{ steps.resolve.outputs.identical }}
      mode: ${{ steps.resolve.outputs.mode }}
      evidence: ${{ steps.resolve.outputs.evidence }}
      qualify: ${{ steps.resolve.outputs.qualify }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - name: Resolve the commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          TARGET: ${{ inputs.target }}
        run: |
          fail() { echo "::error::$1"; echo "Not promoted: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ "$RUN_REF" = refs/heads/main ] || fail "run this workflow from main (it ran from $RUN_REF)"
          case "$TARGET" in
            beta) source=main ;;
            master) source=beta ;;
            *) fail "unknown target $TARGET" ;;
          esac
          sha=$(gh api "repos/$REPO/git/ref/heads/$source" --jq .object.sha) || fail "cannot read $source"
          exists=true
          identical=false
          mode=create
          if target_sha=$(gh api "repos/$REPO/git/ref/heads/$TARGET" --jq .object.sha 2>/dev/null); then
            tree=$(gh api "repos/$REPO/git/commits/$sha" --jq .tree.sha) || fail "cannot read $sha"
            target_tree=$(gh api "repos/$REPO/git/commits/$target_sha" --jq .tree.sha) || fail "cannot read $TARGET"
            status=$(gh api "repos/$REPO/compare/$target_sha...$sha" --jq .status) || fail "cannot compare $TARGET with $source"
            if [ "$status" = identical ] || [ "$tree" = "$target_tree" ]; then
              identical=true
            elif [ "$status" = ahead ]; then
              mode=forward
            else
              mode=merge
            fi
          else
            exists=false
          fi
          evidence=$(sh .github/ci/evidence.sh "$sha")
          qualify=false
          if [ -z "$evidence" ]; then
            [ "$TARGET" = beta ] || fail "$sha (head of beta) has no qualification; promote it to beta again first"
            qualify=true
          fi
          {
            echo "source=$source"
            echo "sha=$sha"
            echo "exists=$exists"
            echo "identical=$identical"
            echo "mode=$mode"
            echo "evidence=$evidence"
            echo "qualify=$qualify"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Promote $source -> $TARGET"
            echo
            echo "- commit: \`$sha\` (head of $source)"
            if [ "$identical" = true ]; then echo "- $TARGET already holds these files: nothing to move"; fi
            if [ "$mode" = merge ]; then echo "- $source is merged into $TARGET (a merge commit with these files)"; fi
            if [ -n "$evidence" ]; then echo "- qualified by $evidence: no matrix runs"; fi
            if [ "$qualify" = true ]; then echo "- not qualified yet: the full tier runs on it now"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  qualify:
    name: Qualify
    needs: resolve
    if: needs.resolve.outputs.qualify == 'true' && needs.resolve.outputs.identical != 'true'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/ci.yml
    with:
      scope: full
      extended: true
      ref: ${{ needs.resolve.outputs.sha }}
      qualify: true

  move:
    name: Move ${{ inputs.target }}
    needs: [resolve, qualify]
    if: >-
      always() && needs.resolve.result == 'success' && needs.resolve.outputs.identical != 'true'
      && (needs.qualify.result == 'success' || needs.qualify.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: promotion
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - name: Qualified, then move
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SOURCE: ${{ needs.resolve.outputs.source }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          fail() { echo "::error::$1"; echo "Not promoted: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          evidence=$(sh .github/ci/evidence.sh "$SHA")
          [ -n "$evidence" ] || fail "$SHA has no qualification"
          [ -n "$PROMOTE_TOKEN" ] || fail "the secret PROMOTE_TOKEN is not set in the environment promotion (CI.md)"
          head=$SHA
          case "$MODE" in
            create)
              GH_TOKEN=$PROMOTE_TOKEN gh api -X POST "repos/$REPO/git/refs" \
                -f ref="refs/heads/$TARGET" -f sha="$SHA" > /dev/null || fail "GitHub refused to create $TARGET at $SHA"
              ;;
            forward | merge)
              if [ "$MODE" = merge ]; then
                # A merge commit with the qualified tree; the target is its
                # first parent, so moving the target to it is a fast-forward.
                tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || fail "cannot read $SHA"
                target_sha=$(gh api "repos/$REPO/git/ref/heads/$TARGET" --jq .object.sha) || fail "cannot read $TARGET"
                head=$(GH_TOKEN=$PROMOTE_TOKEN gh api -X POST "repos/$REPO/git/commits" \
                  -f message="Merge $SOURCE into $TARGET" -f tree="$tree" \
                  -f "parents[]=$target_sha" -f "parents[]=$SHA" --jq .sha) || fail "GitHub refused the merge commit"
                # Same tree as the qualified commit: the same qualification.
                gh api -X POST "repos/$REPO/statuses/$head" -f state=success -f context=sultanc/qualification \
                  -f target_url="$evidence" -f description="same files as ${SHA%"${SHA#????????????}"}, qualified" > /dev/null ||
                  fail "cannot record the qualification on the merge commit"
              fi
              # force=false: GitHub refuses anything but a fast-forward.
              GH_TOKEN=$PROMOTE_TOKEN gh api -X PATCH "repos/$REPO/git/refs/heads/$TARGET" \
                -f sha="$head" -F force=false > /dev/null || fail "GitHub refused to move $TARGET to $head"
              ;;
            *) fail "unknown move $MODE" ;;
          esac
          echo "Promoted: $TARGET is now \`$head\` (files of \`$SHA\`, qualified by $evidence)" >> "$GITHUB_STEP_SUMMARY"
