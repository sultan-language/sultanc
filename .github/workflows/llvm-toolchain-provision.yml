# Trusted, manual cache writer for SultanC's pinned LLVM 22.1.8 toolchains.
name: Provision SultanC LLVM Toolchain

on:
  push:
    branches: [main]
    paths:
      - .github/actions/llvm-toolchain/**
      - .github/ci/contracts.json
      - .github/workflows/llvm-toolchain-provision.yml
  workflow_dispatch:
    inputs:
      host:
        description: Toolchain host (both = Linux/macOS; all includes Windows).
        required: true
        default: both
        type: choice
        options:
          - all
          - both
          - linux-x86_64
          - macos-arm64
          - windows-x86_64
          - windows-arm64

permissions:
  contents: read

concurrency:
  group: sultanc-llvm-toolchain-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  linux:
    name: Provision LLVM / linux-x86_64
    if: ${{ github.event_name == 'push' || inputs.host == 'all' || inputs.host == 'both' || inputs.host == 'linux-x86_64' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout trusted provisioning harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve pinned LLVM cache contract
        id: contract
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          resolve .github/ci/contracts.json

      - name: Check for existing pinned toolchain
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      - name: Verify existing pinned toolchain
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          activate .github/ci/contracts.json true

      - name: Build and verify pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          provision .github/ci/contracts.json

      - name: Save pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

  macos:
    name: Provision LLVM / macos-arm64
    if: ${{ github.event_name == 'push' || inputs.host == 'all' || inputs.host == 'both' || inputs.host == 'macos-arm64' }}
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout trusted provisioning harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve pinned LLVM cache contract
        id: contract
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          resolve .github/ci/contracts.json

      - name: Check for existing pinned toolchain
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      - name: Verify existing pinned toolchain
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          activate .github/ci/contracts.json true

      - name: Build and verify pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          provision .github/ci/contracts.json

      - name: Save pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

  windows_x86_64:
    name: Provision LLVM / windows-x86_64
    if: ${{ github.event_name == 'push' || inputs.host == 'all' || inputs.host == 'windows-x86_64' }}
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - name: Checkout trusted provisioning harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # Qualification can restore this cache from other branches only when
      # the provisioning cache was published in the default branch scope.
      - name: Require default-branch LLVM cache scope
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Windows LLVM cache provisioning must run on main for qualification to restore it.' >&2
            exit 1
          fi

      - name: Activate native MSVC development tools
        shell: pwsh
        run: '& "./.github/actions/llvm-toolchain/msvc-env.ps1"'

      - name: Resolve pinned LLVM cache contract
        id: contract
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          resolve .github/ci/contracts.json

      - name: Check for existing pinned toolchain
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      - name: Verify existing pinned toolchain
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          activate .github/ci/contracts.json true

      - name: Build and verify pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          provision .github/ci/contracts.json

      - name: Save pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      # Cache save can warn rather than fail when publication is denied.
      # Read the exact entry back so provisioning cannot report success without
      # an entry qualification can actually restore and verify.
      - name: Restore published pinned LLVM cache
        id: published-cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Verify published pinned LLVM cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          PUBLISHED_CACHE_HIT: ${{ steps.published-cache.outputs.cache-hit }}
        run: |
          if [[ "$PUBLISHED_CACHE_HIT" != 'true' ]]; then
            echo "Windows LLVM cache not published under expected key: ${{ steps.contract.outputs.cache_key }}" >&2
            exit 1
          fi
          .github/actions/llvm-toolchain/setup.sh activate .github/ci/contracts.json true

  windows_arm64:
    name: Provision LLVM / windows-arm64
    if: ${{ github.event_name == 'push' || inputs.host == 'all' || inputs.host == 'windows-arm64' }}
    runs-on: windows-11-arm
    timeout-minutes: 240
    steps:
      - name: Checkout trusted provisioning harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # Qualification can restore this cache from other branches only when
      # the provisioning cache was published in the default branch scope.
      - name: Require default-branch LLVM cache scope
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Windows LLVM cache provisioning must run on main for qualification to restore it.' >&2
            exit 1
          fi

      - name: Activate native MSVC development tools
        shell: pwsh
        run: '& "./.github/actions/llvm-toolchain/msvc-env.ps1"'

      - name: Resolve pinned LLVM cache contract
        id: contract
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          resolve .github/ci/contracts.json

      - name: Check for existing pinned toolchain
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      - name: Verify existing pinned toolchain
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          activate .github/ci/contracts.json true

      - name: Build and verify pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          provision .github/ci/contracts.json

      - name: Save pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      # Cache save can warn rather than fail when publication is denied.
      # Read the exact entry back so provisioning cannot report success without
      # an entry qualification can actually restore and verify.
      - name: Restore published pinned LLVM cache
        id: published-cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Verify published pinned LLVM cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          PUBLISHED_CACHE_HIT: ${{ steps.published-cache.outputs.cache-hit }}
        run: |
          if [[ "$PUBLISHED_CACHE_HIT" != 'true' ]]; then
            echo "Windows LLVM cache not published under expected key: ${{ steps.contract.outputs.cache_key }}" >&2
            exit 1
          fi
          .github/actions/llvm-toolchain/setup.sh activate .github/ci/contracts.json true
