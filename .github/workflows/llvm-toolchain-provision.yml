# Trusted cache writer for SultanC's pinned LLVM SDKs (LLVM 22.1.8).
# One job per registered host whose ci_hosts[].llvm.method is not "none":
#   prebuilt  pinned upstream archive, SHA-256 verified, shared libLLVM linked
#             from its component archives (minutes)
#   source    pinned llvm-project source built with the host's pinned compiler
#             (clang-cl on Windows), bounded jobs, checked build then install
#             (hours; only this workflow does it)
name: Provision SultanC LLVM Toolchain

on:
  push:
    branches: [main]
    paths:
      - .github/actions/llvm-toolchain/**
      - .github/ci/contracts.json
      - .github/scripts/host-matrix.sh
      - .github/scripts/host-path.sh
      - .github/scripts/host-setup.sh
      - .github/workflows/llvm-toolchain-provision.yml
  workflow_dispatch:
    inputs:
      host:
        description: "Host ID from ci_hosts in contracts.json, or all."
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: sultanc-llvm-toolchain-${{ inputs.host || 'all' }}
  cancel-in-progress: false

jobs:
  hosts:
    name: Resolve trusted host matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.llvm_matrix }}
      count: ${{ steps.matrix.outputs.llvm_host_count }}
    steps:
      - name: Checkout trusted provisioning harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve configured hosts
        id: matrix
        shell: bash
        env:
          REQUESTED_HOST: ${{ github.event_name == 'push' && 'all' || inputs.host }}
        run: .github/scripts/host-matrix.sh .github/ci/contracts.json "${REQUESTED_HOST:-all}"

  provision:
    name: Provision LLVM / ${{ matrix.id }} (${{ matrix.llvm.method }})
    needs: hosts
    if: ${{ needs.hosts.outputs.count != '0' }}
    runs-on: ${{ matrix.runner }}
    env:
      SULTANC_CI_HOST_ID: ${{ matrix.id }}
    # GitHub-hosted jobs stop at 6 hours; a source build is bounded by
    # llvm_toolchain.build.parallel_jobs / link_jobs (host overrides allowed).
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    steps:
      - name: Checkout trusted provisioning harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Initialize registered host prerequisites
        shell: bash
        run: .github/scripts/host-setup.sh .github/ci/contracts.json

      - name: Resolve pinned LLVM cache contract
        id: contract
        shell: bash
        run: .github/actions/llvm-toolchain/setup.sh resolve .github/ci/contracts.json

      - name: Check for existing pinned SDK
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      - name: Verify existing pinned SDK
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: .github/actions/llvm-toolchain/setup.sh activate .github/ci/contracts.json true

      - name: Provision and verify pinned SDK
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: .github/actions/llvm-toolchain/setup.sh provision .github/ci/contracts.json

      - name: Save pinned SDK
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      - name: Retain provisioning diagnostics on failure
        if: ${{ failure() }}
        uses: ./.github/actions/upload-diagnostics
        with:
          name: llvm-provision-${{ matrix.id }}
          path: ${{ runner.temp }}/sultanc-llvm-source.*/build/CMakeFiles/CMake*.log
