# Trusted, manual cache writer for SultanC's pinned LLVM 22.1.8 toolchains.
name: Provision SultanC LLVM Toolchain

on:
  push:
    branches: [main]
    paths:
      - .github/actions/llvm-toolchain/**
      - .github/ci/contracts.json
      - .github/scripts/host-matrix.sh
      - .github/workflows/llvm-toolchain-provision.yml
  workflow_dispatch:
    inputs:
      host:
        description: "Host ID from ci_hosts in contracts.json, all, or both (Linux/macOS)."
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: sultanc-llvm-toolchain-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  hosts:
    name: Resolve trusted host matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout trusted provisioning harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve configured hosts
        id: matrix
        shell: bash
        env:
          REQUESTED_HOST: ${{ github.event_name == 'push' && 'all' || inputs.host }}
        run: .github/scripts/host-matrix.sh .github/ci/contracts.json "${REQUESTED_HOST:-all}"

  provision:
    name: Provision LLVM / ${{ matrix.id }}
    needs: hosts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    steps:
      - name: Checkout trusted provisioning harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Activate native MSVC development tools
        if: ${{ matrix.host_os == 'Windows' }}
        shell: pwsh
        run: '& "./.github/actions/llvm-toolchain/msvc-env.ps1"'

      - name: Resolve pinned LLVM cache contract
        id: contract
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          resolve .github/ci/contracts.json

      - name: Check for existing pinned toolchain
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}

      - name: Verify existing pinned toolchain
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          activate .github/ci/contracts.json true

      - name: Build and verify pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: >-
          .github/actions/llvm-toolchain/setup.sh
          provision .github/ci/contracts.json

      - name: Save pinned LLVM toolchain
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.contract.outputs.toolchain_path }}
          key: ${{ steps.contract.outputs.cache_key }}
