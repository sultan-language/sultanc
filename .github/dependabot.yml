# Declares automated dependency maintenance for GitHub Actions references.
version: 2

# Starts the list of dependency ecosystems maintained by Dependabot.
updates:
  # Maintains external actions used by files under .github/workflows and .github/actions.
  - package-ecosystem: github-actions
    # Scans GitHub Actions references from the repository root.
    directory: /
    # Declares when Dependabot should check for newer action releases.
    schedule:
      # Checks once per week to avoid noisy daily action-update pull requests.
      interval: weekly
      # Runs the weekly check on Monday.
      day: monday
      # Runs after the nightly/security windows in UTC.
      time: '08:00'
      # Uses UTC so the schedule is deterministic.
      timezone: Etc/UTC
    # Limits simultaneously open GitHub Actions update pull requests.
    open-pull-requests-limit: 5
    # Groups routine GitHub Actions updates into one reviewable maintenance pull request.
    groups:
      # Names the dependency-update group.
      github-actions:
        # Includes every GitHub Actions dependency in this maintenance group.
        patterns:
          # Matches all actions.
          - '*'
